name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })' || mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: BACKEND

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: BACKEND/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        env:
          NODE_ENV: test
          MONGO_URI: mongodb://127.0.0.1:27017/civicflow_automated_test
          PORT: 5001
          JWT_SECRET: test_jwt_secret_ci_32_character_key_min
          GOOGLE_CLIENT_ID: mock-client-id
          GOOGLE_CLIENT_SECRET: mock-client-secret
          IMAGE_KIT_PRIVATE_KEY: mock-imagekit-key
          CLIENT_URL: http://localhost:5173
        run: npm test
